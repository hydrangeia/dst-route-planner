<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>默认大陆路线规划</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #26372d;
      --muted: #68786d;
      --line: #d9e1d8;
      --paper: #f5f6ef;
      --surface: #fffefa;
      --green: #466b4d;
      --green-dark: #31563b;
      --green-soft: #e9f0e6;
      --sand: #f2e8d2;
      --amber: #a36b22;
      --red: #9b4638;
      --red-soft: #f8e9e5;
      --shadow: 0 8px 24px rgb(38 55 45 / 6%);
      font-family: "Microsoft YaHei UI", "Noto Sans CJK SC", "PingFang SC", system-ui, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 7% 0%, rgb(221 231 211 / 55%), transparent 31rem),
        var(--paper);
    }
    button, input, select, textarea { font: inherit; }
    button, select, input[type="checkbox"] { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible,
    summary:focus-visible { outline: 3px solid #98b78d; outline-offset: 2px; }
    .page { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 30px 0 58px; }
    .topline { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
    .identity { display: flex; align-items: flex-start; gap: 14px; }
    .mark {
      display: grid; flex: 0 0 42px; width: 42px; height: 42px; place-items: center;
      color: var(--green-dark); background: var(--green-soft); border: 1px solid #d3dfcf;
      border-radius: 14px; font-size: 22px; line-height: 1;
    }
    h1 { margin: 1px 0 4px; font-size: clamp(23px, 4vw, 30px); letter-spacing: -.035em; }
    .subtitle { max-width: 650px; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .api-state {
      display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto; margin-top: 5px;
      padding: 8px 11px; border: 1px solid var(--line); border-radius: 999px;
      color: var(--muted); background: rgb(255 254 250 / 75%); font-size: 12px;
    }
    .api-dot { width: 8px; height: 8px; border-radius: 50%; background: #b78e48; }
    .api-state.ready .api-dot { background: #5d8c5f; }
    .api-state.error .api-dot { background: #b95a48; }
    .panel {
      border: 1px solid var(--line); border-radius: 17px; background: var(--surface); box-shadow: var(--shadow);
    }
    .toolbar { display: flex; align-items: end; flex-wrap: wrap; gap: 12px; padding: 17px; }
    .control { display: grid; gap: 6px; min-width: 190px; }
    .control.seed-control { min-width: 116px; width: 130px; }
    .control > span, .field-label { color: #53665a; font-size: 12px; font-weight: 700; }
    select, input[type="number"], input[type="text"], textarea {
      width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid #ccd6cc;
      border-radius: 9px; color: var(--ink); background: #fff;
    }
    select:hover, input:hover, textarea:hover { border-color: #aebfae; }
    .toolbar-spacer { flex: 1 1 auto; }
    .action-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      min-height: 40px; padding: 8px 13px; border: 1px solid #cbd5ca; border-radius: 9px;
      color: #405447; background: #fff; font-weight: 650; font-size: 13px;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }
    .button:hover:not(:disabled) { border-color: #98ad98; background: #f3f7f1; }
    .button:active:not(:disabled) { transform: translateY(1px); }
    .button:disabled { cursor: wait; opacity: .7; }
    .button.primary { border-color: var(--green); color: #fff; background: var(--green); }
    .button.primary:hover:not(:disabled) { border-color: var(--green-dark); background: var(--green-dark); }
    .button.Quiet { background: transparent; }
    .button-icon { font-size: 16px; line-height: 1; }
    .message {
      display: none; margin-top: 11px; padding: 10px 13px; border-radius: 10px;
      font-size: 13px; line-height: 1.55;
    }
    .message.visible { display: block; }
    .message.info { color: #4d644f; background: #edf3e9; }
    .message.error { color: #823c31; background: var(--red-soft); }
    .current-badge { display: none; align-items: center; justify-content: space-between; gap: 12px; margin-top: 11px; padding: 9px 12px; border: 1px solid #d8e2d4; border-radius: 10px; color: #52675a; background: #f0f5ed; font-size: 12px; }
    .current-badge.visible { display: flex; }
    .current-clear { padding: 4px 7px; border: 0; border-radius: 7px; color: #687a6d; background: transparent; font-size: 11px; }
    .current-clear:hover { background: #e4ecdf; }
    .section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 27px 2px 12px; }
    .section-head h2 { margin: 0 0 3px; font-size: 19px; letter-spacing: -.02em; }
    .section-head p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .toggle-label { display: inline-flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; color: #53665a; background: #fffefa; font-size: 12px; white-space: nowrap; }
    .toggle-label input { accent-color: var(--green); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .direction-card { min-width: 0; padding: 15px; border: 1px solid var(--line); border-radius: 15px; background: var(--surface); box-shadow: 0 4px 14px rgb(38 55 45 / 3%); }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .direction-title { display: flex; align-items: center; gap: 9px; margin: 0; font-size: 15px; }
    .arrow {
      display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px;
      color: var(--green-dark); background: var(--green-soft); font-size: 17px; line-height: 1;
    }
    .direction-id { color: #88958b; font-size: 10px; font-weight: 600; letter-spacing: .05em; }
    .card-section + .card-section { margin-top: 14px; }
    .card-section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
    .subtle { color: #879389; font-size: 11px; }
    .tile-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tile-chip {
      position: relative; display: inline-flex; align-items: center; min-height: 29px; padding: 4px 8px;
      border: 1px solid #d9e1d8; border-radius: 8px; color: #526258; background: #fff;
      font-size: 11px; line-height: 1.3; cursor: pointer;
    }
    .tile-chip:has(input:checked) { border-color: #86a286; color: var(--green-dark); background: #edf4e9; }
    .tile-chip:has(input:disabled) { border-style: dashed; }
    .tile-chip input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .tile-chip input:focus-visible + span { outline: 3px solid #98b78d; outline-offset: 2px; border-radius: 2px; }
    .prefab-list { display: grid; gap: 7px; }
    .prefab-row { display: grid; grid-template-columns: minmax(0, 1fr) 82px 31px; gap: 7px; align-items: center; }
    .prefab-row input { min-width: 0; min-height: 35px; padding: 6px 8px; font-size: 12px; }
    .prefab-row input[type="number"] { text-align: center; }
    .remove-row { width: 31px; height: 31px; border: 1px solid transparent; border-radius: 8px; color: #8b655d; background: transparent; font-size: 17px; }
    .remove-row:hover { border-color: #edd8d2; background: #fbf0ec; }
    .add-row { min-height: 30px; margin-top: 7px; padding: 4px 7px; border: 0; border-radius: 7px; color: var(--green); background: transparent; font-size: 12px; font-weight: 700; }
    .add-row:hover { background: #edf3e9; }
    details.extra { margin-top: 13px; border-top: 1px solid #edf0e9; padding-top: 9px; }
    details.extra summary { width: fit-content; color: #6f7e73; font-size: 11px; cursor: pointer; }
    .extra-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-top: 10px; }
    .extra-grid label { display: grid; gap: 5px; color: #64746a; font-size: 11px; }
    .extra-grid input, .extra-grid select { min-height: 34px; padding: 6px 8px; font-size: 11px; }
    .full { grid-column: 1 / -1; }
    .results-head { align-items: center; }
    .stale-note { display: none; margin-top: 4px; color: var(--amber); font-size: 11px; }
    .stale-note.visible { display: block; }
    .empty-results { padding: 24px 17px; border: 1px dashed #cdd7cb; border-radius: 14px; color: #708075; background: rgb(255 254 250 / 55%); text-align: center; font-size: 13px; line-height: 1.6; }
    .results-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .result-card { padding: 15px; border: 1px solid #d5dfd3; border-radius: 14px; background: var(--surface); box-shadow: 0 4px 16px rgb(38 55 45 / 4%); }
    .result-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .result-direction { display: flex; align-items: center; gap: 9px; }
    .rank { display: grid; width: 25px; height: 25px; place-items: center; border-radius: 8px; color: #70501e; background: var(--sand); font-size: 12px; font-weight: 800; }
    .result-direction h3 { margin: 0; font-size: 15px; }
    .result-share { color: var(--green-dark); font-size: 17px; font-weight: 800; white-space: nowrap; }
    .bar-track { overflow: hidden; height: 8px; margin: 11px 0 12px; border-radius: 999px; background: #e8ede5; }
    .bar-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, #8aa67c, #496e4e); transition: width .25s ease; }
    .explanations { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
    .explanations li { display: flex; gap: 8px; color: #526258; font-size: 12px; line-height: 1.55; }
    .explanations li::before { content: "·"; color: #78936f; font-weight: 900; }
    .metrics { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
    .metric { padding: 4px 7px; border-radius: 7px; color: #69776d; background: #f0f3ed; font-size: 10px; }
    .tasks-box { margin-top: 13px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 13px; background: #fbfcf7; }
    .tasks-box h3 { margin: 0 0 8px; color: #5a6b5e; font-size: 12px; }
    .task-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .task-chip { padding: 5px 8px; border: 1px solid #e0e6dc; border-radius: 8px; color: #66756b; background: #fff; font-size: 11px; }
    .task-chip b { color: #415448; }
    .spinner { width: 14px; height: 14px; border: 2px solid rgb(255 255 255 / 45%); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 760px) {
      .page { width: min(100% - 22px, 600px); padding-top: 20px; }
      .topline { flex-direction: column; gap: 10px; }
      .api-state { margin: 0 0 0 56px; }
      .toolbar { align-items: stretch; }
      .control { flex: 1 1 100%; min-width: 0; }
      .control.seed-control { flex: 1 1 100%; width: auto; }
      .toolbar-spacer { display: none; }
      .action-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .action-row .primary { grid-column: 1 / -1; grid-row: 1; }
      .grid, .results-grid { grid-template-columns: 1fr; }
      .section-head { align-items: flex-start; }
      .section-head .toggle-label { align-self: center; }
    }
    @media (max-width: 430px) {
      .section-head { align-items: flex-start; flex-direction: column; }
      .section-head .toggle-label { align-self: flex-start; }
      .extra-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .result-share { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topline">
      <div class="identity">
        <div class="mark" aria-hidden="true">⌖</div>
        <div>
          <h1>默认大陆路线规划</h1>
          <p class="subtitle">记下四周看到的地皮和地标，查看更值得先探索的方向。</p>
        </div>
      </div>
      <div class="api-state" id="apiState" role="status"><span class="api-dot"></span><span id="apiStateText">正在连接本地引擎</span></div>
    </header>

    <section class="panel" aria-label="目标和操作">
      <div class="toolbar">
        <label class="control" for="targetSelect"><span>想找什么</span><select id="targetSelect" aria-label="选择目标"></select></label>
        <label class="control seed-control" for="seedInput"><span>随机种子</span><input id="seedInput" type="number" min="0" step="1" value="0" inputmode="numeric"></label>
        <div class="toolbar-spacer"></div>
        <div class="action-row">
          <button class="button primary" id="calculateButton" type="button"><span class="button-icon" aria-hidden="true">⌁</span><span>计算方向</span></button>
          <button class="button" id="demoButton" type="button">载入排箫示例</button>
          <button class="button" id="loadButton" type="button">载入 JSON</button>
          <button class="button" id="downloadButton" type="button">下载观测 JSON</button>
          <button class="button Quiet" id="resetButton" type="button">重置</button>
          <input class="sr-only" id="fileInput" type="file" accept=".json,application/json" aria-label="选择观测 JSON 文件">
        </div>
      </div>
    </section>
    <div class="message" id="message" role="status" aria-live="polite"></div>
    <div class="current-badge" id="currentBadge"><span id="currentSummary"></span><button class="current-clear" id="clearCurrent" type="button">移除</button></div>

    <section aria-labelledby="observationTitle">
      <div class="section-head">
        <div>
          <h2 id="observationTitle">周围观测</h2>
          <p>只填写有看到的线索；空白方向不会参与计算。prefab 数量可填 0 或更大的整数。</p>
        </div>
        <label class="toggle-label"><input id="diagonalToggle" type="checkbox"><span>显示八方位</span></label>
      </div>
      <div class="grid" id="directionGrid" aria-live="off"></div>
    </section>

    <section aria-labelledby="resultsTitle">
      <div class="section-head results-head">
        <div>
          <h2 id="resultsTitle">方向建议</h2>
          <p>百分比表示本次候选方向之间的相对优先度。</p>
          <div class="stale-note" id="staleNote">观测已修改；下方结果仍对应上一份输入。</div>
        </div>
      </div>
      <div id="resultsArea"><div class="empty-results">填入至少一个方向的有效线索，再点“计算方向”。</div></div>
    </section>
    <datalist id="prefabOptions"></datalist>
  </main>

  <script>
    "use strict";

    const TARGETS = {
      antlion_spawner: "蚁狮地形点", beequeenhive: "蜂后蜂巢", cave_entrance: "洞穴入口",
      dragonfly_spawner: "龙蝇竞技场", lightninggoat: "电羊", mandrake_planted: "曼德拉草",
      mermhouse: "鱼人房", molehill: "鼹鼠丘", moonbase: "月台", moose_nesting_ground: "麋鹿鹅巢",
      oasislake: "绿洲湖", panflute: "排箫", pigking: "猪王", resurrectionstone: "复活石",
      spiderden: "蜘蛛巢", statueglommer: "格罗姆雕像", tentacle: "触手", walrus_camp: "海象营地",
      wasphive: "杀人蜂巢", wormhole: "虫洞"
    };
    const TARGET_ORDER = Object.keys(TARGETS);
    const DIRS = ["north", "northeast", "east", "southeast", "south", "southwest", "west", "northwest"];
    const CARDINALS = ["north", "east", "south", "west"];
    const DIR_LABELS = {
      north: ["北", "↑"], northeast: ["东北", "↗"], east: ["东", "→"], southeast: ["东南", "↘"],
      south: ["南", "↓"], southwest: ["西南", "↙"], west: ["西", "←"], northwest: ["西北", "↖"]
    };
    const TILE_LABELS = {
      GRASS: "草地", FOREST: "森林", DECIDUOUS: "落叶林", SAVANNA: "草原", MARSH: "沼泽",
      ROCKY: "岩石地", DIRT: "泥地", DIRT_NOISE: "泥地边缘", GROUND_NOISE: "混合地形",
      LIGHTNINGBLUFF: "雷电高地", METEOR: "陨石地", CAVE: "洞穴"
    };
    const PREFAB_LABELS = {
      evergreen: "常青树", deciduoustree: "落叶树", grass: "草", flower: "花", pighouse: "猪屋",
      pigking: "猪王", spiderden: "蜘蛛巢", beehive: "蜂箱", beequeenhive: "蜂后蜂巢",
      rocks: "石头", rock1: "岩石", rock2: "岩石堆", rabbithole: "兔子洞", molehill: "鼹鼠丘",
      sapling: "树苗", twiggytree: "树枝树", berrybush: "浆果丛", berrybush_juicy: "多汁浆果丛",
      fireflies: "萤火虫", tentacle: "触手", mermhouse: "鱼人房", walrus_camp: "海象营地",
      moonbase: "月台", panflute: "排箫", mandrake_planted: "曼德拉草", statueglommer: "格罗姆雕像",
      cave_entrance: "洞穴入口", resurrectionstone: "复活石", wormhole: "虫洞", oasislake: "绿洲湖",
      wasphive: "杀人蜂巢", lightninggoat: "电羊", moose_nesting_ground: "麋鹿鹅巢",
      dragonfly_spawner: "龙蝇巢", antlion_spawner: "蚁狮", goldnugget: "金块", flint: "燧石",
      carrot: "胡萝卜", reeds: "芦苇", pond: "池塘", pond_mos: "沼泽池塘", marsh_tree: "沼泽树"
    };
    const TASK_LABELS = {
      "Make a pick": "制作镐子", "Dig that rock": "挖开岩石", "Great Plains": "大草原", Squeltch: "沼泽与蜘蛛",
      "Beeeees!": "蜜蜂！", "Speak to the king": "觐见猪王", "Forest hunters": "森林猎手",
      "For a nice walk": "散步路线", Dragonfly: "龙蝇", "Lightning Bluff": "雷电高地",
      "Befriend the pigs": "结交猪人", "Kill the spiders": "消灭蜘蛛", "Killer bees!": "杀人蜂！",
      "Make a Beehat": "制作蜂帽", MooseBreedingTask: "麋鹿鹅繁殖区", "Mole Colony Rocks": "岩地鼹鼠群",
      "Mole Colony Deciduous": "落叶林鼹鼠群", "Frogs and bugs": "青蛙与虫子"
    };
    const ROOM_LABELS = {
      MagicalDeciduous: "神秘落叶林", PigKingdom: "猪王村", PigVillage: "猪人村", BeeQueenBee: "蜂后蜂巢地形",
      LightningBluffAntlion: "蚁狮地形点", LightningBluffLightning: "电羊地形", DragonflyArena: "龙蝇竞技场",
      MandrakeHome: "曼德拉草地形", SlightlyMermySwamp: "鱼人沼泽", MolesvilleRocky: "岩地鼹鼠群",
      DeciduousMole: "落叶林鼹鼠群", SpiderVillage: "蜘蛛村", WalrusHut_Grassy: "海象营地地形",
      MoonbaseOne: "月台树林", Pondopolis: "池塘区", Graveyard: "墓地", Rocky: "岩石地形"
    };
    const EXPLANATIONS = {
      "target prefab visible; go directly there": "已经看到目标地标，可以优先前往确认。",
      "target landmark prefab visible": "看到了目标路线上的地标。",
      "direction appears to cross into a connected room/task": "这个方向看起来通向可继续探索的房间或地形块。",
      "background-like area, discounted": "这里更像外围背景区域，入口线索更值得优先查看。",
      "weak evidence; score mainly from task progression priors": "目前线索较少，建议结合周围方向继续观察。"
    };

    const state = {
      options: { targets: [], tile_types: [], prefabs: [], directions: [] },
      target: "panflute", seed: "0", showDiagonals: false, current: null,
      dirs: Object.fromEntries(DIRS.map(direction => [direction, emptyDirection()])),
      result: null, revision: 0, requestId: 0, controller: null, loading: false
    };
    const el = {
      target: document.getElementById("targetSelect"), seed: document.getElementById("seedInput"),
      grid: document.getElementById("directionGrid"), diagonal: document.getElementById("diagonalToggle"),
      apiState: document.getElementById("apiState"), apiStateText: document.getElementById("apiStateText"),
      message: document.getElementById("message"), calculate: document.getElementById("calculateButton"),
      demo: document.getElementById("demoButton"), load: document.getElementById("loadButton"),
      download: document.getElementById("downloadButton"), reset: document.getElementById("resetButton"),
      file: document.getElementById("fileInput"), results: document.getElementById("resultsArea"),
      stale: document.getElementById("staleNote"), prefabOptions: document.getElementById("prefabOptions"),
      currentBadge: document.getElementById("currentBadge"), currentSummary: document.getElementById("currentSummary"),
      clearCurrent: document.getElementById("clearCurrent")
    };

    function emptyDirection() {
      return { tiles: [], prefabRows: [{ id: "", count: "1" }], connection: "", background: "", note: "", roomHints: "", taskHints: "" };
    }
    function esc(value) {

      el.stale.classList.toggle("visible", !!state.result);
      if (isObservationOnly) {
        setMessage(`${label}已载入当前位置观测。`, "info");
      } else {
        const importedCount = Object.values(imported).filter(data => data.tiles.length || data.prefabRows.some(row => row.id) || data.connection !== "" || data.background !== "" || data.roomHints || data.taskHints || data.note.trim()).length;
        setMessage(`${label}已载入，包含 ${importedCount} 个有内容的方向。`, "info");
      }
    }
    async function loadDemo() {
      clearMessage();
      cancelStaleRequest();
      const requestId = ++state.requestId;
      const revision = state.revision;
      const controller = new AbortController();
      state.controller = controller;
      el.demo.disabled = true;
      el.demo.textContent = "正在载入…";
      try {
        const response = await fetch("/api/demo", { headers: { "Accept": "application/json" }, signal: controller.signal });
        const payload = await readJsonResponse(response);
        if (requestId !== state.requestId || revision !== state.revision) return;
        applyPayload(payload, "排箫示例");
      } catch (error) {
        if (error.name !== "AbortError" && requestId === state.requestId && revision === state.revision) setMessage(`示例载入失败：${error.message}`, "error");
      } finally {
        if (requestId === state.requestId) state.controller = null;
        el.demo.disabled = false;
        el.demo.textContent = "载入排箫示例";
      }
    }
    function createExportPayload() {
      const { errors, payload } = validateRequest(true, true);
      if (errors.length) throw new Error(errors.join(" "));
      const allDirections = {};
      for (const direction of DIRS) {
        const observation = toObservation(direction, [], "", true);
        if (observation) allDirections[direction] = observation;
      }
      payload.directions = allDirections;
      return payload;
    }
    function downloadJson() {
      clearMessage();
      try {
        const payload = createExportPayload();
        const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"], { type: "application/json;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url; link.download = `dst-observation-${state.target || "map"}.json`;
        document.body.append(link); link.click(); link.remove(); URL.revokeObjectURL(url);
        setMessage("观测 JSON 已下载。", "info");
      } catch (error) { setMessage(error.message, "error"); }
    }
    async function readFile(file) {
      if (!file) return;
      clearMessage();
      const revision = state.revision;
      try {
        const payload = JSON.parse(await file.text());
        if (revision !== state.revision) throw new Error("读取文件时观测已有变化；文件未载入，请再选一次。" );
        applyPayload(payload, file.name);
      } catch (error) {
        setMessage(`无法载入文件：${error.message}`, "error");
      } finally { el.file.value = ""; }
    }
    function resetForm() {
      cancelStaleRequest();
      state.dirs = Object.fromEntries(DIRS.map(direction => [direction, emptyDirection()]));
      state.target = state.options.targets.includes("panflute") ? "panflute" : (state.options.targets[0] || "panflute");
      state.seed = "0"; state.showDiagonals = false; state.current = null; state.result = null;
      el.diagonal.checked = false; el.seed.value = "0"; el.stale.classList.remove("visible");
      updateCurrentBadge();
      el.results.innerHTML = '<div class="empty-results">填入至少一个方向的有效线索，再点“计算方向”。</div>';
      renderTargetOptions(); renderCards(); clearMessage();
    }
    function handleGridInput(event) {
      const target = event.target;
      const direction = target.dataset.direction;
      if (!direction || !state.dirs[direction]) return;
      const data = state.dirs[direction];
      if (target.classList.contains("tile-check")) {
        data.tiles = [...el.grid.querySelectorAll(`.tile-check[data-direction="${direction}"]:checked`)].map(input => input.value);
      } else if (target.classList.contains("prefab-id")) {
        data.prefabRows[Number(target.dataset.index)].id = target.value;
      } else if (target.classList.contains("prefab-count")) {
        data.prefabRows[Number(target.dataset.index)].count = target.value;
      } else if (target.classList.contains("connection-like")) {
        data.connection = target.value;
      } else if (target.classList.contains("background-like")) {
        data.background = target.value;
      } else if (target.classList.contains("room-hints")) {
        data.roomHints = target.value;
      } else if (target.classList.contains("task-hints")) {
        data.taskHints = target.value;
      } else if (target.classList.contains("direction-note")) {
        data.note = target.value;
      } else return;
      cancelStaleRequest();
    }

    el.target.addEventListener("change", () => { state.target = el.target.value; cancelStaleRequest(); });
    el.seed.addEventListener("input", () => { state.seed = el.seed.value; cancelStaleRequest(); });
    el.diagonal.addEventListener("change", () => {
      state.showDiagonals = el.diagonal.checked; cancelStaleRequest(); renderCards();
    });
    el.grid.addEventListener("input", handleGridInput);
    el.grid.addEventListener("change", handleGridInput);
    el.grid.addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const direction = button.dataset.direction;
      if (!state.dirs[direction]) return;
      if (button.dataset.action === "add-row") state.dirs[direction].prefabRows.push({ id: "", count: "1" });
      if (button.dataset.action === "remove-row") {
        const index = Number(button.dataset.index);
        state.dirs[direction].prefabRows.splice(index, 1);
        if (!state.dirs[direction].prefabRows.length) state.dirs[direction].prefabRows.push({ id: "", count: "1" });
      }
      cancelStaleRequest(); renderCards();
    });
    el.calculate.addEventListener("click", calculate);
    el.demo.addEventListener("click", loadDemo);
    el.load.addEventListener("click", () => el.file.click());
    el.file.addEventListener("change", () => readFile(el.file.files?.[0]));
    el.download.addEventListener("click", downloadJson);
    el.reset.addEventListener("click", resetForm);
    el.clearCurrent.addEventListener("click", () => {
      state.current = null; cancelStaleRequest(); updateCurrentBadge();
    });

    initialize();
  </script>
</body>
</html>
